name: Publish shared FR3 dev base

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.dev-base
      - assets/models/franka_fr3_v2/**
      - .github/workflows/dev-base.yml
      - scripts/smoke-dev-base.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Build image for local testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev-base
          tags: ros2-fr3-dev:${{ github.sha }}
          load: true
          push: false
      - name: Smoke test simulator and Franka fake hardware
        run: |
          docker run --rm -v "$PWD/scripts:/smoke:ro" \
            "ros2-fr3-dev:$GITHUB_SHA" bash /smoke/smoke-dev-base.sh
      - name: Publish tested image to Harbor
        if: github.ref == 'refs/heads/main'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          : "${HARBOR_USERNAME:?Set the HARBOR_USERNAME GitHub Actions secret}"
          : "${HARBOR_PASSWORD:?Set the HARBOR_PASSWORD GitHub Actions secret}"
          image="harbor.keti.xrds.kr/physical_ai_hub/ros2-fr3-dev"
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.keti.xrds.kr \
            --username "$HARBOR_USERNAME" --password-stdin
          docker tag "ros2-fr3-dev:$GITHUB_SHA" "$image:jazzy-$GITHUB_SHA"
          docker tag "ros2-fr3-dev:$GITHUB_SHA" "$image:jazzy"
          docker push "$image:jazzy-$GITHUB_SHA"
          docker push "$image:jazzy"
