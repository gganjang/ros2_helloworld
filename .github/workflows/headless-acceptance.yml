name: ROS package, acceptance, and runtime

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install package test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pytest \
            ros-jazzy-rclpy \
            ros-jazzy-control-msgs \
            ros-jazzy-trajectory-msgs \
            ros-jazzy-builtin-interfaces
      - name: Build and test ROS package
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select fr3_wave
          source install/setup.bash
          colcon test --packages-select fr3_wave
          colcon test-result --verbose

  headless-acceptance:
    needs: package-test
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Verify MuJoCo CPU requirements
        run: |
          if ! grep -qw avx /proc/cpuinfo; then
            echo "ERROR: MuJoCo requires an x86-64 runner with AVX exposed."
            exit 1
          fi
      - name: Install acceptance test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pytest \
            ros-jazzy-mujoco-ros2-control \
            ros-jazzy-joint-trajectory-controller \
            ros-jazzy-joint-state-broadcaster \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-control-msgs \
            ros-jazzy-trajectory-msgs \
            ros-jazzy-sensor-msgs
      - name: Run platform acceptance tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -e
          mkdir -p test-artifacts
          export CI_ARTIFACT_DIR="$GITHUB_WORKSPACE/test-artifacts"
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select fr3_wave
          source install/setup.bash
          /usr/bin/python3 -m pytest -q tests/acceptance
      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-mujoco-log
          path: test-artifacts/
          if-no-files-found: ignore

  franka-fake-acceptance:
    needs: headless-acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Harbor for pinned dev base
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.keti.xrds.kr \
            --username "$HARBOR_USERNAME" --password-stdin
      - name: Pull tested dev image and run sample app with Franka fake hardware
        env:
          DEV_IMAGE: harbor.keti.xrds.kr/physical_ai_hub/ros2-fr3-dev:jazzy-0c84c486a85aed0a8cb18114f82ab89b964c0af9
        run: |
          docker pull "$DEV_IMAGE"
          docker run --rm -v "$PWD:/repo:ro" "$DEV_IMAGE" \
            bash /repo/scripts/test-franka-fake-client.sh

  runtime-image:
    needs: [headless-acceptance, franka-fake-acceptance]
    if: always() && needs.headless-acceptance.result == 'success' && (github.event_name == 'pull_request' || needs.franka-fake-acceptance.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Build runtime image for local testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          tags: fr3-wave-runtime:${{ github.sha }}
          load: true
          push: false
      - name: Smoke test runtime image
        run: |
          docker run --rm "fr3-wave-runtime:$GITHUB_SHA" bash -lc '
            ros2 pkg executables fr3_wave | grep -F "fr3_wave wave" &&
            ros2 pkg executables fr3_wave | grep -F "fr3_wave spin" &&
            python3 -c "import fr3_wave.wave; import fr3_wave.spin" &&
            ! ros2 pkg prefix mujoco_ros2_control
          '
      - name: Publish tested runtime image to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          : "${HARBOR_USERNAME:?Set the HARBOR_USERNAME GitHub Actions secret}"
          : "${HARBOR_PASSWORD:?Set the HARBOR_PASSWORD GitHub Actions secret}"
          image="harbor.keti.xrds.kr/physical_ai_hub/fr3-wave-runtime:runtime-$GITHUB_SHA"
          printf '%s' "$HARBOR_PASSWORD" | docker login harbor.keti.xrds.kr \
            --username "$HARBOR_USERNAME" --password-stdin
          docker tag "fr3-wave-runtime:$GITHUB_SHA" "$image"
          docker push "$image"
