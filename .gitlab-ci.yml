stages:
  - package-test
  - acceptance
  - publish

package-test:
  stage: package-test
  image: ros:jazzy-ros-base-noble
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      set -e
      apt-get update
      apt-get install -y --no-install-recommends \
        python3-pytest \
        ros-jazzy-rclpy \
        ros-jazzy-control-msgs \
        ros-jazzy-trajectory-msgs \
        ros-jazzy-builtin-interfaces
      . /opt/ros/jazzy/setup.sh
      colcon build --packages-select fr3_wave
      . install/setup.sh
      colcon test --packages-select fr3_wave
      colcon test-result --verbose

headless-acceptance:
  stage: acceptance
  image: ros:jazzy-ros-base-noble
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - |
      set -e
      if ! grep -qw avx /proc/cpuinfo; then
        echo "ERROR: MuJoCo requires an x86-64 runner with AVX exposed."
        echo "Assign this job to an AVX-capable runner or enable host CPU passthrough for the runner VM."
        exit 1
      fi
  script:
    - |
      set -e
      apt-get update
      apt-get install -y --no-install-recommends \
        python3-pytest \
        ros-jazzy-mujoco-ros2-control \
        ros-jazzy-joint-trajectory-controller \
        ros-jazzy-joint-state-broadcaster \
        ros-jazzy-robot-state-publisher \
        ros-jazzy-control-msgs \
        ros-jazzy-trajectory-msgs \
        ros-jazzy-sensor-msgs
      mkdir -p "$CI_PROJECT_DIR/test-artifacts"
      export CI_ARTIFACT_DIR="$CI_PROJECT_DIR/test-artifacts"
      . /opt/ros/jazzy/setup.sh
      colcon build --packages-select fr3_wave
      . install/setup.sh
      /usr/bin/python3 -m pytest -q tests/acceptance
  artifacts:
    when: always
    paths:
      - test-artifacts/
    expire_in: 1 week

publish-runtime-image:
  stage: publish
  dependencies: []
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --config /tmp/buildkitd.toml
  before_script:
    - |
      set -e
      : "${CI_REGISTRY_IMAGE:?Enable the GitLab Container Registry for this project to publish the runtime image}"
      : "${CI_REGISTRY_USER:?GitLab Container Registry credentials are unavailable}"
      : "${CI_REGISTRY_PASSWORD:?GitLab Container Registry credentials are unavailable}"
      mkdir -p "$HOME/.docker"
      auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > "$HOME/.docker/config.json"
      printf '[worker.oci]\n  max-parallelism = 2\n' > /tmp/buildkitd.toml
  script:
    - |
      set -e
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile.runtime \
        --output "type=image,name=$CI_REGISTRY_IMAGE:runtime-$CI_COMMIT_SHA,push=true"
