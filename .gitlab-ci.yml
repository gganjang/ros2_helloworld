stages:
  - package-test
  - acceptance
  - build-runtime
  - smoke-runtime
  - publish

package-test:
  stage: package-test
  image: ros:jazzy-ros-base-noble
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - |
      set -e
      apt-get update
      apt-get install -y --no-install-recommends \
        python3-pytest \
        ros-jazzy-rclpy \
        ros-jazzy-control-msgs \
        ros-jazzy-trajectory-msgs \
        ros-jazzy-builtin-interfaces
      . /opt/ros/jazzy/setup.sh
      cd examples/fr3_wave
      colcon build --packages-select fr3_wave
      . install/setup.sh
      colcon test --packages-select fr3_wave
      colcon test-result --verbose

headless-acceptance:
  stage: acceptance
  image: ros:jazzy-ros-base-noble
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - |
      set -e
      if ! grep -qw avx /proc/cpuinfo; then
        echo "ERROR: MuJoCo requires an x86-64 runner with AVX exposed."
        echo "Assign this job to an AVX-capable runner or enable host CPU passthrough for the runner VM."
        exit 1
      fi
  script:
    - |
      set -e
      apt-get update
      apt-get install -y --no-install-recommends \
        python3-pytest \
        ros-jazzy-mujoco-ros2-control \
        ros-jazzy-joint-trajectory-controller \
        ros-jazzy-joint-state-broadcaster \
        ros-jazzy-robot-state-publisher \
        ros-jazzy-control-msgs \
        ros-jazzy-trajectory-msgs \
        ros-jazzy-sensor-msgs
      mkdir -p "$CI_PROJECT_DIR/test-artifacts"
      export CI_ARTIFACT_DIR="$CI_PROJECT_DIR/test-artifacts"
      . /opt/ros/jazzy/setup.sh
      cd examples/fr3_wave
      colcon build --packages-select fr3_wave
      . install/setup.sh
      /usr/bin/python3 -m pytest -q tests/acceptance
  artifacts:
    when: always
    paths:
      - test-artifacts/
    expire_in: 1 week

# DOCKER_AUTH_CONFIG is a GitLab CI variable containing Harbor robot credentials.
# The runner uses it to pull the private candidate image before smoke-runtime starts.
build-runtime-candidate:
  stage: build-runtime
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  dependencies: []
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --config /tmp/buildkitd.toml
  before_script:
    - |
      set -e
      : "${DOCKER_AUTH_CONFIG:?Set Harbor DOCKER_AUTH_CONFIG in GitLab CI variables}"
      mkdir -p "$HOME/.docker"
      printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
      printf '[worker.oci]\n  max-parallelism = 2\n' > /tmp/buildkitd.toml
  script:
    - |
      set -e
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=examples/fr3_wave/Dockerfile.runtime \
        --output "type=image,name=harbor.keti.xrds.kr/physical_ai_hub/fr3-wave-runtime:candidate-$CI_COMMIT_SHA,push=true"

smoke-runtime-image:
  stage: smoke-runtime
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image:
    name: "harbor.keti.xrds.kr/physical_ai_hub/fr3-wave-runtime:candidate-$CI_COMMIT_SHA"
    entrypoint: [""]
  needs: [build-runtime-candidate]
  script:
    - |
      set -e
      /runtime-entrypoint.sh bash -lc '
        ros2 pkg executables fr3_wave | grep -F "fr3_wave wave" &&
        ros2 pkg executables fr3_wave | grep -F "fr3_wave spin" &&
        python3 -c "import fr3_wave.wave; import fr3_wave.spin" &&
        ! ros2 pkg prefix mujoco_ros2_control
      '

publish-runtime-image:
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image:
    name: quay.io/skopeo/stable:latest
    entrypoint: [""]
  needs: [smoke-runtime-image]
  script:
    - |
      set -e
      : "${DOCKER_AUTH_CONFIG:?Set Harbor DOCKER_AUTH_CONFIG in GitLab CI variables}"
      mkdir -p "$HOME/.docker"
      printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"
      skopeo copy --all --preserve-digests \
        --authfile "$HOME/.docker/config.json" \
        "docker://harbor.keti.xrds.kr/physical_ai_hub/fr3-wave-runtime:candidate-$CI_COMMIT_SHA" \
        "docker://harbor.keti.xrds.kr/physical_ai_hub/fr3-wave-runtime:runtime-$CI_COMMIT_SHA"
